[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepseek-agents-starter"
version = "0.1.0"
description = "Starter project for OpenAI Agents SDK with DeepSeek"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents",
  "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_agent"]
